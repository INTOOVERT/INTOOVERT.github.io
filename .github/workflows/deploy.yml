name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "assets/**"
      - "media/**"
      - "models/**"
      - "textures/**"
      - "index.html"
      - ".nojekyll"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish build to site root
        run: |
          cp dist/index.html index.html
          rm -rf assets media models textures
          cp -r dist/assets assets
          cp -r dist/media media
          cp -r dist/models models
          cp -r dist/textures textures
          cp dist/.nojekyll .nojekyll
          rm -rf docs
          cp -r dist docs

      - name: Commit published site
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Deploy site to root
          file_pattern: |
            index.html
            assets/**
            media/**
            models/**
            textures/**
            .nojekyll
            docs/**
