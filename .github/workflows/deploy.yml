name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Copy build into docs/
        run: |
          rm -rf docs
          cp -r dist docs

      - name: Commit docs/
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Deploy site to docs/
          file_pattern: docs/**
